[package]
name = "index-mirror"
version = "0.1.0"
edition = "2021"
description = "索引分层镜 — read-only Git index / split-index / sparse-index reviewer"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
